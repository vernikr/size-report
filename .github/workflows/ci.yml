name: CI

# On every push and every pull request — **one profile command** rather than a list of
# steps: `pnpm run verify`. The list of checks lives in one place
# (`tools/gates/run.js`), so locally and here the same commands run in the
# same order — `test/gates-verify.test.js` reads this file and guards that.
# It needs no secrets: everything the checks read lies in the repository, including
# the history of the consumer project (`fixtures/live`).
on: [push, pull_request]

jobs:
  # The job name is the required check: branch protection refers to it, which is why it
  # is called by the same word as the command.
  verify:
    runs-on: ubuntu-latest
    steps:
      # The history is needed in full: the documentation guard reads the help of the revision
      # pinned in the install example (`git show <pin>:src/refusal.js`), and the duplicate
      # reading compares the tree with the `main` branch. A shallow clone can do neither.
      # The actions are pinned by commit SHA (not by a floating tag) — as is the
      # pnpm version from the manifest's `packageManager` field.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup
        run: pnpm install --frozen-lockfile

      # Preparation rather than a check: the `main` branch is needed by the duplicate reading
      # (its baseline is built from that tree). With no branch at all, the sensor says it was skipped.
      - name: The main branch for the duplicate reading
        run: git fetch --no-tags origin main || echo "origin/main is unavailable — the duplicate reading was skipped"

      - name: The checks — the same commands as locally
        run: pnpm run verify

name: CI

# На каждый пуш и на каждый запрос правки — **одна команда профиля**, а не перечень
# шагов: `pnpm run verify`. Список проверок живёт в одном месте
# (`tools/gates/run.js`), поэтому локально и здесь гоняются одни и те же команды в
# одном порядке — за этим следит `test/gates-verify.test.js`, читая этот файл.
# Секретов не требует: всё, что читают проверки, лежит в репозитории, включая
# историю проекта-потребителя (`fixtures/live`).
on: [push, pull_request]

jobs:
  # Имя работы — обязательный чек: branch protection ссылается на него, поэтому оно
  # и называется тем же словом, что команда.
  verify:
    runs-on: ubuntu-latest
    steps:
      # История нужна целиком: сторож документации читает справку закреплённой в
      # примере установки ревизии (`git show <пин>:src/refusal.js`), а взгляд на дубли
      # сравнивает дерево с веткой `main`. На обрезанном клоне и то, и другое нечем.
      # Действия закреплены по SHA коммита (не по плавающей метке) — как и версия
      # pnpm из поля `packageManager` манифеста.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Установка
        run: pnpm install --frozen-lockfile

      # Подготовка, а не проверка: ветка `main` нужна взгляду на дубли (база строится
      # из её дерева). Если ветки нет вовсе, датчик сам скажет, что взгляд пропущен.
      - name: Ветка main для взгляда на дубли
        run: git fetch --no-tags origin main || echo "origin/main недоступен — взгляд на ветку пропущен"

      - name: Проверки — те же команды, что локально
        run: pnpm run verify

name: CI

# На каждый пуш и на каждый запрос правки — одними и теми же командами, что и у
# себя локально. Секретов не требует: всё, что читают проверки, лежит в
# репозитории, включая историю проекта-потребителя (fixtures/live).
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Полная история тут не нужна: свою таблицу объёма этот репозиторий не
      # считает, а эталоны и история потребителя лежат файлами в fixtures/.
      - uses: actions/checkout@v7

      # Версия pnpm — из поля packageManager в package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Установка
        run: pnpm install --frozen-lockfile

      - name: Линтер (строгий)
        run: pnpm run lint:strict

      - name: Набор проверок
        run: pnpm test

      # Тот же набор так, как его видит машина без настроек git вовсе. Внутри
      # набора чужие среды задаются только движку; здесь без настроек работает вся
      # обвязка: клоны фикстуры, сверка с рабочим деревом, чтение путей
      # (BLOCKERS.md §B1).
      - name: Набор в среде без настроек машины
        run: pnpm test
        env:
          GIT_CONFIG_GLOBAL: /dev/null

      - name: Работа из собранного пакета
        run: pnpm run pack:check

      # Живая история проекта-потребителя — из бандла: сам проект приватный, и
      # ключа у этого job нет. Бандл несёт ту же ревизию, что записана в эталоне.
      - name: Паритет с историей проекта-потребителя
        run: pnpm run parity:live -- --repo fixtures/live/history.bundle

      # Пересъём обоих эталонов пишет файлы, поэтому идёт во временный каталог и
      # сверяется с закоммиченным: так проверяется, что эталоны воспроизводимы, а
      # рабочее дерево остаётся чистым.
      - name: Эталоны воспроизводятся
        run: pnpm run check:standards

name: Release

# A release is a tag and nothing more: `git push origin v1.2.3` assembles the package,
# runs the checks and sends it to the registry. Neither a secret nor a code from an
# authenticator: publishing goes through trusted publishing (OIDC) — npm accepts it by the
# GitHub Actions attestation issued for this job rather than by a token.
# So there is nothing to set up in the repository settings: not a single `secrets.` is
# in the steps below, and `test/release.test.js` guards exactly that.
#
# The publisher is set up once and lives on the npmjs.com side rather than in this file:
#   `npm trust github @vernikr/size-report --file release.yml --repo vernikr/size-report
#   --allow-publish` — the Trusted Publisher button in the package's settings does the
#   same; the environment is empty because this job declares none.
# That the link exists is visible with `npm trust list @vernikr/size-report`.
# After that a release is a tag; what would go out can be seen from a draft run
# (Actions → Release → Run workflow, "dry run" is on by default).
#
# What the job does NOT do: it does not raise the version (a person names it in the
# manifest, and it is compared with the tag rather than invented here), does not
# publish a prerelease into `latest` and does not touch the package's consumers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish nothing: assemble the package and show what would go out'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing lives on it: without it npm has nothing to present

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The actions are pinned by commit SHA rather than by a floating tag: a tag gets moved.
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      # `registry-url` is deliberately not given here: setup-node then writes the line
      # `_authToken=${NODE_AUTH_TOKEN}` into `.npmrc`, and with it npm takes the
      # credentials for given and never goes for the OIDC attestation — publishing fails
      # with 404 while the publisher is configured correctly. The registry address is the
      # default one anyway, and the one needed is written in the manifest's `publishConfig`.
      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer, while Node 22 brings npm 10.
      - name: npm newer (for trusted publishing)
        run: npm install -g npm@latest

      - name: Setup
        run: pnpm install --frozen-lockfile

      # A release publishes rather than edits: the same full suite as in CI.
      - name: The checks before the release
        run: pnpm run lint:strict && pnpm test:all

      - name: The work from the assembled package
        run: pnpm run pack:check

      # The version comes from the manifest rather than from the tag: two numbers can be
      # compared only when both are read rather than one derived from the other.
      - name: The manifest version into the environment
        if: github.event_name == 'push'
        run: echo "WANT=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The tag and the manifest's version are one and the same number: otherwise the registry
      # would get a version the history does not hold, and the tag would install the wrong thing.
      - name: The tag names the same version as the manifest
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "$WANT" || { echo "the tag is $GITHUB_REF_NAME while the manifest holds $WANT"; exit 1; }

      # A prerelease goes to `next` rather than to `latest`: a default install must not
      # pick up a draft.
      - name: Publishing
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --tag "${{ contains(github.ref_name, '-') && 'next' || 'latest' }}"

      # The draft run: assemble the package and walk the publishing path sending nothing.
      # Its version is a draft increment over the manifest (`1.1.1` → `1.1.2-draft.0`):
      # the registry refuses to publish an already published version, and on an honest
      # number the run would be red for a reason unrelated to the release settings.
      # This edit lives in the runner's working directory alone and goes nowhere.
      #
      # What the draft run does **not** check: whether the publisher (trusted publisher) is
      # configured. `--dry-run` exchanges no attestation and passes with no credentials
      # at all (checked in an empty directory: code 0 with no token) — only a real tag checks that.
      - name: The draft run — nothing reached the registry
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm version prerelease --preid=draft --no-git-tag-version && npm publish --dry-run --tag next

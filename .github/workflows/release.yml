name: Release

# Выпуск — это тег, и больше ничего: `git push origin v1.2.3` собирает пакет,
# прогоняет проверки и отправляет его в реестр. Ни секрета, ни кода из
# аутентификатора: публикация идёт через trusted publishing (OIDC) — npm принимает
# её по удостоверению GitHub Actions, выписанному для этого job'а, а не по токену.
# Поэтому в настройках репозитория заводить нечего: в шагах ниже нет ни одного
# `secrets.`, и это же стережёт `test/release.test.js`.
#
# Издатель заводится один раз и живёт на стороне npmjs.com, а не в этом файле:
#   `npm trust github @vernikr/size-report --file release.yml --repo vernikr/size-report
#   --allow-publish` — то же самое делает кнопка Trusted Publisher в настройках
#   пакета; окружение пустое, потому что этот job его не объявляет.
# Что связь есть, видно командой `npm trust list @vernikr/size-report`.
# После этого выпуск — это тег; посмотреть, что уехало бы, можно черновым
# прогоном (Actions → Release → Run workflow, «dry run» включён по умолчанию).
#
# Что job НЕ делает: не поднимает версию (её называет человек в манифесте и
# `CHANGELOG.md` — и они сверяются с тегом, а не выдумываются здесь), не
# публикует prerelease в `latest` и не трогает потребителей пакета.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ничего не публиковать: собрать и показать, что уехало бы'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # этим и живёт trusted publishing: без него npm нечего предъявить

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # `registry-url` здесь намеренно не указан: setup-node пишет тогда в `.npmrc`
      # строку `_authToken=${NODE_AUTH_TOKEN}`, а с ней npm считает учётные данные
      # заданными и за удостоверением OIDC не идёт — публикация падает 404 при
      # верной настройке издателя. Адрес реестра и так по умолчанию
      # registry.npmjs.org, а нужный явно прописан в `publishConfig` манифеста.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing требует npm 11.5.1 и новее, а с Node 22 приходит npm 10.
      - name: npm поновее (для trusted publishing)
        run: npm install -g npm@latest

      - name: Установка
        run: pnpm install --frozen-lockfile

      # Выпуск выкладывает, а не правит: тот же полный набор, что и в CI.
      - name: Проверки перед выпуском
        run: pnpm run lint:strict && pnpm test:all

      - name: Работа из собранного пакета
        run: pnpm run pack:check

      # Версия берётся из манифеста, а не из тега: сверять два числа можно только
      # тогда, когда оба прочитаны, а не выведены одно из другого.
      - name: Версия манифеста — в окружение
        if: github.event_name == 'push'
        run: echo "WANT=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Тег и версия в манифесте — одно и то же число: иначе реестр получил бы
      # версию, которой нет в истории, и по тегу поставилось бы не то.
      - name: Тег называет ту же версию, что манифест
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "$WANT" || { echo "тег $GITHUB_REF_NAME, а в манифесте $WANT"; exit 1; }

      # Prerelease уходит в `next`, а не в `latest`: установка по умолчанию не
      # должна подхватывать черновик.
      - name: Публикация
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --tag "${{ contains(github.ref_name, '-') && 'next' || 'latest' }}"

      # Черновой прогон: собрать пакет и пройти путь публикации, ничего не отправляя.
      # Версия в нём — черновая надстройка над манифестом (`1.1.1` → `1.1.2-draft.0`):
      # реестр отказывает в публикации уже выпущенной версии, и на честном номере
      # прогон был бы красным по причине, которая к настройке выпуска не относится.
      # Эта правка живёт только в рабочем каталоге раннера и никуда не едет.
      #
      # Чего черновой прогон **не** проверяет: настроен ли издатель (trusted publisher).
      # `--dry-run` не обменивается удостоверением и проходит вообще без учётных данных
      # (проверено в пустом каталоге: код 0 без токена) — это проверяет только настоящий тег.
      - name: Черновой прогон — в реестр ничего не ушло
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm version prerelease --preid=draft --no-git-tag-version && npm publish --dry-run --tag next

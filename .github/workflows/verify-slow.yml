name: Scheduled checks

# The slow profile: what costs more than an ordinary edit and is therefore not in every run —
# coverage under c8 (the full suite under it runs for tens of seconds). Everything that runs in
# `pnpm run verify` runs here too: the slow profile covers the full one, so that "by schedule"
# does not come to mean "some other checks" (`test/gates-verify.test.js`).
#
# Run: by schedule and by hand: `Actions → Scheduled checks → Run workflow`.
# The branch is the main one only: a schedule runs on the default branch.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  verify-slow:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Setup
        run: pnpm install --frozen-lockfile

      - name: The main branch for the duplicate reading
        run: git fetch --no-tags origin main || echo "origin/main is unavailable — the duplicate reading was skipped"

      - name: The slow profile checks — the same commands as locally
        run: pnpm run verify:slow

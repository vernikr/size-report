name: Проверки по расписанию

# Slow-профиль: то, что дороже обычной правки и потому не в каждом прогоне, —
# покрытие под c8 (полный набор под ним идёт десятки секунд). Здесь же идёт всё, что
# и в `pnpm run verify`: slow-профиль накрывает полный, чтобы «по расписанию» не
# значило «какие-то другие проверки» (`test/gates-verify.test.js`).
#
# Запуск — по расписанию и руками: `Actions → Проверки по расписанию → Run workflow`.
# Ветка — только основная: расписание работает по ветке по умолчанию.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  verify-slow:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # pnpm/action-setup v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      # actions/setup-node v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Установка
        run: pnpm install --frozen-lockfile

      - name: Ветка main для взгляда на дубли
        run: git fetch --no-tags origin main || echo "origin/main недоступен — взгляд на ветку пропущен"

      - name: Проверки slow-профиля — те же команды, что локально
        run: pnpm run verify:slow

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File size by commit</title>
<style>
#grid {
--col: 70px;
--row: 25px;
--head: 50px;
--commit: 220px;
--grid-line: rgba(127, 127, 127, .25);
position: relative;
font-variant-numeric: tabular-nums;
}
#grid .row { position: absolute; left: 0; width: 100%; height: var(--row); }
#grid .cells {
position: absolute;
top: 0;
display: grid;
grid-auto-flow: column;
grid-auto-columns: var(--col);
height: var(--row);
}
#grid .cells > span, #grid .hgroups > span, #grid .hmetrics > span { box-sizing: border-box; white-space: nowrap; }
#grid .cells > span {
padding: 2px 4px;
line-height: 20px;
border-bottom: 1px solid var(--grid-line);
}
#grid .num { text-align: right; }
#grid .cells > .g, #grid .hmetrics > .g, #grid .hgroups > .gh { border-left: 1px solid var(--grid-line); }
#grid .head { position: sticky; top: 0; left: 0; z-index: 3; height: var(--head); background: Canvas; }
#grid .hgroups, #grid .hmetrics { position: absolute; display: grid; grid-auto-flow: column; grid-auto-columns: var(--col); }
#grid .hgroups { top: 0; height: var(--row); }
#grid .hmetrics { top: var(--row); height: var(--row); }
#grid .hgroups > span, #grid .hmetrics > span {
padding: 2px 4px;
line-height: 20px;
border-bottom: 1px solid var(--grid-line);
}
#grid .hgroups > span { text-align: center; overflow: hidden; text-overflow: ellipsis; }
#grid .hmetrics > span { text-align: center; color: CanvasText; }
#grid .c-commit {
position: sticky;
left: 0;
z-index: 2;
box-sizing: border-box;
width: var(--commit);
height: var(--row);
line-height: var(--row);
padding: 0 4px;
background: Canvas;
text-align: left;
font-weight: 400;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
border-bottom: 1px solid var(--grid-line);
}
#grid .c-commit a { color: inherit; }
#grid .head .c-commit { z-index: 6; height: var(--head); line-height: var(--head); }
#grid .clip { display: flex; align-items: baseline; gap: 6px; width: 100%; }
#grid .when { flex: none; opacity: .7; }
#grid .subj { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
#grid .subj.plain { opacity: .7; }
#grid .sect { flex: none; opacity: .7; font-size: 11px; text-decoration: none; border-bottom: 1px dotted currentColor; }
#grid .up { color: #1e8449; }
#grid .down { color: #c0392b; }
#grid .miss { opacity: .5; }
#grid .row.now > .c-commit { font-weight: 600; }
#grid .row:hover > .c-commit, #grid .row:hover > .cells > span {
background-image: linear-gradient(rgba(127, 127, 127, .08), rgba(127, 127, 127, .08));
}
:root {
color-scheme: light dark;
--gap: 12px;
--pad: clamp(16px, 3vw, 34px);
--radius: 10px;
--muted: rgba(127, 127, 127, .85);
--line: rgba(127, 127, 127, .25);
--tint: rgba(127, 127, 127, .07);
}
body {
margin: 0;
padding: var(--pad) var(--pad) 48px;
background: Canvas;
color: CanvasText;
font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
-webkit-text-size-adjust: 100%;
}
h1 { margin: 0 0 3px; font-size: 21px; font-weight: 650; letter-spacing: -.012em; }
.sub { margin: 0 0 calc(var(--gap) + 4px); color: var(--muted); font-size: 12.5px; }
.panel {
margin: 0 0 var(--gap);
padding: 12px 14px 13px;
border: 1px solid var(--line);
border-radius: var(--radius);
background: var(--tint);
}
.panel fieldset { margin: 0; padding: 0; border: 0; }
.panel fieldset + fieldset { margin-top: 10px; }
.panel legend {
padding: 0;
color: var(--muted);
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: .07em;
}
.panel .row { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.panel .about { margin: 5px 0 0; color: var(--muted); font-size: 11.5px; }
.panel .files { max-height: min(30vh, 320px); overflow: auto; font-size: 12.5px; }
.panel .tree { margin: 0; padding: 0 0 0 14px; list-style: none; }
.panel .tree .tree { margin-left: 14px; padding-left: 9px; border-left: 1px solid var(--line); }
.panel .tree .box { padding: 1px 7px 1px 5px; }
.box.dir { font-weight: 600; }
.box .n { margin-left: 1px; color: var(--muted); font-size: 11px; }
.panel .tree li.folded > .tree { display: none; }
.panel .tree li { position: relative; }
.panel .tree li > .fold {
position: absolute;
left: -13px;
width: 14px;
text-align: center;
color: var(--muted);
cursor: pointer;
user-select: none;
}
.panel .tree li > .fold:hover { color: CanvasText; }
.box {
display: inline-flex;
gap: 6px;
align-items: center;
padding: 3px 9px 3px 7px;
border-radius: 999px;
cursor: pointer;
}
.box:hover { background: var(--tint); }
.box input { margin: 0; accent-color: AccentColor; }
.box.all { font-weight: 600; }
.box.plain { cursor: default; opacity: .55; }
.box.plain:hover { background: none; }
.box.plain input { cursor: default; }
.shell {
overflow: auto;
max-height: calc(100vh - 300px);
border: 1px solid var(--line);
border-radius: var(--radius);
background: Canvas;
}
#grid { font-size: 12.5px; }
.notice {
margin: 0 0 var(--gap);
padding: 9px 13px;
border-left: 3px solid AccentColor;
border-radius: 4px;
background: var(--tint);
font-size: 12.5px;
}
.notice[hidden] { display: none; }
.state {
margin: var(--gap) 0 0;
padding: 11px 13px;
border: 1px dashed var(--line);
border-radius: var(--radius);
color: var(--muted);
font-size: 12.5px;
}
.state[hidden], .shell[hidden] { display: none; }
.note { margin: 14px 0 0; max-width: 90em; color: var(--muted); font-size: 12px; }
.note code { background: var(--tint); padding: 0 3px; border-radius: 3px; }
:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; border-radius: 3px; }
@media (min-width: 900px) {
body {
box-sizing: border-box;
height: 100vh;
height: 100dvh;
padding-bottom: var(--gap);
overflow: auto;
display: grid;
grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
grid-template-rows: auto auto minmax(0, 1fr) auto auto;
column-gap: var(--gap);
align-items: stretch;
}
header { grid-area: 1 / 1 / 2 / -1; }
#notice { grid-area: 2 / 2 / 3 / 3; }
#shell { grid-area: 3 / 2 / 4 / 3; }
#state { grid-area: 4 / 2 / 5 / 3; align-self: start; }
#note { grid-area: 5 / 2 / 6 / 3; }
#panel { grid-area: 2 / 1 / -1 / 2; min-height: 0; margin-bottom: 0; padding-top: 0; overflow: auto; }
.panel > fieldset:first-child { padding-top: 12px; }
.shell { max-height: none; }
.panel .files { max-height: none; overflow: visible; }
.panel .cats {
position: sticky;
top: 0;
z-index: 2;
background-color: Canvas;
background-image: linear-gradient(var(--tint), var(--tint));
}
body:has(#shell[hidden]) #state { grid-area: 3 / 2 / 4 / 3; }
}
@media (max-width: 899px) {
body { padding: 14px 14px 32px; }
h1 { font-size: 18px; }
#grid { font-size: 12px; }
.shell { max-height: calc(100vh - 260px); }
}
</style>
</head>

const g0 = count === 0 ? 0 : Math.floor(span.c0 / count);
const g1 = count === 0 ? -1 : Math.floor(span.c1 / count);
if (cache.head === null) cache.head = appHeadNew();
const h = cache.head;
if (h.g[0] === g0 && h.g[1] === g1) return h.el;
const was = h.g;
h.g = [g0, g1];
h.groups.style.left = (APP_COMMIT + g0 * count * APP_COL) + 'px';
h.metrics.style.left = h.groups.style.left;
appStrip(h.groups, was, h.g, (g) => appCaption(
g === 0 ? appUi.total : appData.files[cache.list[g - 1]].label, 'gh', count));
appStrip(h.metrics, [was[0] * count, was[1] * count + count - 1], [g0 * count, g1 * count + count - 1],
(c) => appCaption(cache.labels[c % count], c % count === 0 ? 'g' : '', 1));
return h.el;
}
function appSpan(cache) {
const shell = cache.shell;
cache.keys = [];
cache.labels = [];
appData.metrics.forEach((m) => {
if (appView.metrics[m.key] === true) { cache.keys.push(m.key); cache.labels.push(m.label); }
});
const count = cache.keys.length;
cache.list = appList();
let rank = 0;
cache.rank = [];
appData.files.forEach((_f, i) => { cache.rank[i] = appView.files[i] === true ? rank++ : -1; });
cache.slot = cache.list.map((i) => cache.rank[i]);
const cols = count * (cache.list.length + 1);
const rows = appData.rows.length + 1;
cache.grid.style.width = (APP_COMMIT + cols * APP_COL) + 'px';
cache.grid.style.height = (APP_HEAD + rows * APP_ROW) + 'px';
if (count === 0) return { r0: 0, r1: -1, c0: 0, c1: -1 };
const high = shell.clientHeight || APP_MIN_ROWS * APP_ROW;
const wide = shell.clientWidth || APP_MIN_COLS * APP_COL;
const top = shell.scrollTop + APP_HEAD;
return {
r0: Math.max(0, Math.floor(top / APP_ROW) - APP_OVER),
r1: Math.min(rows - 1, Math.floor((top + high) / APP_ROW) + APP_OVER),
c0: Math.max(0, Math.floor(shell.scrollLeft / APP_COL) - APP_OVER),
c1: Math.min(cols - 1, Math.floor((shell.scrollLeft + wide) / APP_COL) + APP_OVER)
};
}
function appWindow(cache, redraw) {
const span = appSpan(cache);
const was = cache.win;
cache.win = span;
if (redraw === true || was === null) {
cache.grid.textContent = '';
cache.rows.clear();
cache.head = null;
cache.grid.appendChild(appHead(cache, span));
for (let r = span.r0; r <= span.r1; r++) appPlace(cache, r, span);
return;
}
appHead(cache, span);
[...cache.rows.keys()].forEach((r) => {
if (r >= span.r0 && r <= span.r1) { appCells(cache.rows.get(r), cache, span); return; }
cache.rows.get(r).el.remove();
cache.rows.delete(r);
});
for (let r = span.r0; r <= span.r1; r++) {
if (!cache.rows.has(r)) appPlace(cache, r, span);
}
}
function appTable(grid) {
const cache = {
grid: grid,
shell: document.getElementById('shell'),
keys: [],
labels: [],
list: [],
rank: [],
slot: [],
rows: new Map(),
head: null,
win: null
};
cache.shell.addEventListener('scroll', () => appWindow(cache));
window.addEventListener('resize', () => appWindow(cache, true));
return cache;
}
let appCache = null;
function appNote() {
document.getElementById('note').textContent = appUi.note
.replace('{rows}', appData.rows.length)
.replace('{command}', appData.report.fixCommand);
}
function appCounts() {
appState(appData.metrics.filter((m) => appView.metrics[m.key] === true).length,
appView.files.filter((on) => on === true).length);
}
function appPaint() {
appWindow(appCache, true);
appCounts();
appPanelAll();
appWrite();
}
function appChanged(touched) {
appWindow(appCache, true);
appCounts();
if (touched.length > 0) appPanelState(touched);
appWrite();
appNotice('');
}
function appSwitch(i, on) {
if (appView.files[i] === on) return;
appView.files[i] = on;
appChanged([i]);
}
function appSwitchGroup(indexes, on) {
const touched = indexes.filter((i) => appView.files[i] !== on);
touched.forEach((i) => { appView.files[i] = on; });
appChanged(touched);
}
function appSwitchMetric() {
appChanged([]);
}
function appFirst() {
appPanel();
appCache = appTable(document.getElementById('grid'));
appNote();
appPaint();
}
let appBooted = false;
async function appBegin() {
try {
appBoot(await appUnpack(document.getElementById('data')));
} catch (_e) {
appNotice(appUi.unpack);
return;
}
const appStart = appLinkUse();
appTransient = appStart === 'ours';
if (appStart !== 'ours') {
const appSaved = appRead();
if (appSaved !== null) appApply(appSaved);
}
appFoldRead();
appFirst();
appBooted = true;
appTransient = false;
}
window.appDrawn = appBegin();
window.addEventListener('hashchange', () => {
if (!appBooted) return;
appTransient = appLinkUse() === 'ours';
appPaint();
appTransient = false;
});</script>

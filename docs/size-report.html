<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File size by commit</title>
<style>
table { border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; width: 100%; }
#grid { --cell-pad: 4px; --col-line: 1px; --clip: 190px; }
th, td { padding: 2px var(--cell-pad); border-bottom: 1px solid rgba(127, 127, 127, .25); white-space: nowrap; }
#grid col { width: calc(var(--ch, 0px) + var(--cell-pad) * 2 + var(--col-line)); }
#grid col.c-commit { width: calc(var(--clip) + var(--cell-pad) * 2 + var(--col-line)); }
thead th { position: sticky; top: 0; z-index: 3; background: Canvas; text-align: center; line-height: 20px; padding: 0 var(--cell-pad); }
thead tr:first-child th { border-bottom-width: 2px; }
thead tr:last-child th { top: 22px; }
.num { text-align: right; }
#grid .g { border-left: 0; }
#grid:not(.m-off-0) .g.m0,
#grid.m-off-0:not(.m-off-1) .g.m1,
#grid.m-off-0.m-off-1:not(.m-off-2) .g.m2,
#grid.m-off-0.m-off-1.m-off-2:not(.m-off-3) .g.m3 { border-left: 1px solid rgba(127, 127, 127, .35); }
#grid:not(.m-none) .gh { border-left: 1px solid rgba(127, 127, 127, .35); }
#grid.m-off-0 .m0, #grid.m-off-1 .m1, #grid.m-off-2 .m2, #grid.m-off-3 .m3 { display: none; }
#grid .off { display: none; }
.c-commit { position: sticky; left: 0; z-index: 2; background: Canvas; text-align: left; font-weight: 400; }
.c-commit a { color: inherit; }
thead .c-commit { z-index: 6; }
.clip { display: flex; align-items: baseline; gap: 6px; width: 100%; }
.when { flex: none; opacity: .7; }
.subj { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
.subj.plain { opacity: .7; }
.sect { flex: none; opacity: .7; font-size: 11px; text-decoration: none; border-bottom: 1px dotted currentColor; }
.up { color: #1e8449; }
.down { color: #c0392b; }
.miss { opacity: .5; }
tr.now th, tr.now td { border-bottom: 2px solid rgba(127, 127, 127, .35); }
tr.now .c-commit { font-weight: 600; }
tbody tr:hover th, tbody tr:hover td { background-image: linear-gradient(rgba(127, 127, 127, .08), rgba(127, 127, 127, .08)); }
:root {
color-scheme: light dark;
--gap: 12px;
--pad: clamp(16px, 3vw, 34px);
--radius: 10px;
--muted: rgba(127, 127, 127, .85);
--line: rgba(127, 127, 127, .32);
--tint: rgba(127, 127, 127, .07);
}
body {
margin: 0;
padding: var(--pad) var(--pad) 48px;
background: Canvas;
color: CanvasText;
font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
-webkit-text-size-adjust: 100%;
}
h1 { margin: 0 0 3px; font-size: 21px; font-weight: 650; letter-spacing: -.012em; }
.sub { margin: 0 0 calc(var(--gap) + 4px); color: var(--muted); font-size: 12.5px; }
.panel {
margin: 0 0 var(--gap);
padding: 12px 14px 13px;
border: 1px solid var(--line);
border-radius: var(--radius);
background: var(--tint);
}
.panel fieldset { margin: 0; padding: 0; border: 0; }
.panel fieldset + fieldset { margin-top: 10px; }
.panel legend, .panel .cap {
padding: 0;
color: var(--muted);
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: .07em;
}
.panel .cap { display: block; margin-bottom: 4px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.panel .about { margin: 5px 0 0; color: var(--muted); font-size: 11.5px; }
.panel .files { max-height: min(30vh, 320px); overflow: auto; font-size: 12.5px; }
.panel .tree { margin: 0; padding: 0 0 0 14px; list-style: none; }
.panel .tree .tree { margin-left: 14px; padding-left: 9px; border-left: 1px solid var(--line); }
.panel .tree .box { padding: 1px 7px 1px 5px; }
.box.dir { font-weight: 600; }
.box .n { margin-left: 1px; color: var(--muted); font-size: 11px; }
.panel .tree li.folded > .tree { display: none; }
.panel .tree li { position: relative; }
.panel .tree li > .fold {
position: absolute;
left: -13px;
width: 14px;
text-align: center;
color: var(--muted);
cursor: pointer;
user-select: none;
}
.panel .tree li > .fold:hover { color: var(--ink); }
.box {
display: inline-flex;
gap: 6px;
align-items: center;
padding: 3px 9px 3px 7px;
border-radius: 999px;
cursor: pointer;
}
.box:hover { background: var(--tint); }
.box input { margin: 0; accent-color: AccentColor; }
.box.all { font-weight: 600; }
.box.plain { cursor: default; opacity: .55; }
.box.plain:hover { background: none; }
.box.plain input { cursor: default; }
.shell {
overflow: auto;
max-height: calc(100vh - 300px);
border: 1px solid var(--line);
border-radius: var(--radius);
background: Canvas;
}
#grid { font-size: 12.5px; }
.notice {
margin: 0 0 var(--gap);
padding: 9px 13px;
border-left: 3px solid AccentColor;
border-radius: 4px;
background: var(--tint);
font-size: 12.5px;
}
.notice[hidden] { display: none; }
.state {
margin: var(--gap) 0 0;
padding: 11px 13px;
border: 1px dashed var(--line);
border-radius: var(--radius);
color: var(--muted);
font-size: 12.5px;
}
.state[hidden], .shell[hidden] { display: none; }
.note { margin: 14px 0 0; max-width: 90em; color: var(--muted); font-size: 12px; }
.note code { background: var(--tint); padding: 0 3px; border-radius: 3px; }
:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; border-radius: 3px; }
@media (min-width: 900px) {
body {
box-sizing: border-box;
height: 100vh;
height: 100dvh;
padding-bottom: var(--gap);
overflow: auto;
display: grid;
grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
grid-template-rows: auto auto minmax(0, 1fr) auto auto;
column-gap: var(--gap);
align-items: stretch;
}
header { grid-area: 1 / 1 / 2 / -1; }
#notice { grid-area: 2 / 2 / 3 / 3; }
#shell { grid-area: 3 / 2 / 4 / 3; }
#state { grid-area: 4 / 2 / 5 / 3; align-self: start; }
#note { grid-area: 5 / 2 / 6 / 3; }
#panel { grid-area: 2 / 1 / -1 / 2; min-height: 0; margin-bottom: 0; padding-top: 0; overflow: auto; }
.panel > fieldset:first-child { padding-top: 12px; }
.shell { max-height: none; }
.panel .files { max-height: none; overflow: visible; }
.panel .cats {
position: sticky;
top: 0;
z-index: 2;
background-color: Canvas;
background-image: linear-gradient(var(--tint), var(--tint));
}
body:has(#shell[hidden]) #state { grid-area: 3 / 2 / 4 / 3; }
}
@media (max-width: 899px) {
body { padding: 14px 14px 32px; }
h1 { font-size: 18px; }
#grid { font-size: 12px; }
.shell { max-height: calc(100vh - 260px); }
}
</style>
</head>

function appBreadth(text) {

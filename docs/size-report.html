<head>
<meta charset="utf-8">

<title>Объём файлов по коммитам</title>
<style>
/* Гарнитура одна на всю таблицу; числа выравниваются по разрядам за счёт
 * tabular-nums, а не за счёт моноширинного шрифта. */
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 2px 7px; border-bottom: 1px solid rgba(127, 127, 127, .25); white-space: nowrap; }
/* Шапка из двух строк: обе липкие, поэтому вторая сдвинута ровно на высоту первой
 * (line-height 20 + 2px нижней границы), иначе строки накладывались бы друг на друга. */
thead th { position: sticky; top: 0; z-index: 3; background: Canvas; text-align: center; line-height: 20px; padding: 0 7px; }
thead tr:first-child th { border-bottom-width: 2px; }
thead tr:last-child th { top: 22px; }
.num { text-align: right; }
.g { border-left: 1px solid rgba(127, 127, 127, .35); }
/* Липкая левая колонка: фон непрозрачный (Canvas), иначе при скролле вправо под
 * клеткой были бы видны числа. Ярус выше соседних клеток (2) и ниже шапки (3);
 * угол шапки — выше всех, иначе группы колонок наползают на «Коммит». */
.c-commit { position: sticky; left: 0; z-index: 2; background: Canvas; text-align: left; font-weight: 400; }
.c-commit a { color: inherit; }
thead .c-commit { z-index: 6; }
/* Ширину колонки задаёт этот блок. Без него содержимое ячейки выходило за её
 * границы и рисовалось поверх соседних чисел: у ячейки таблицы нет обрезки. */
.clip { display: flex; align-items: baseline; gap: 6px; width: 300px; }
.when { flex: none; opacity: .7; }
.subj { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
.subj.plain { opacity: .7; }
.sect { flex: none; opacity: .7; font-size: 11px; text-decoration: none; border-bottom: 1px dotted currentColor; }
/* Рост зелёный, спад красный — по договорённости с заказчиком (рост — «больше
 * логики», а не тревога). */
.up { color: #1e8449; }
.down { color: #c0392b; }
.miss { opacity: .5; }
/* Верхняя строка — текущие размеры: она же и объясняет, к чему относятся дельты. */
tr.now th, tr.now td { border-bottom: 2px solid rgba(127, 127, 127, .35); }
tr.now .c-commit { font-weight: 600; }
/* Подсветка строки — наложением, а не подменой фона: липкая колонка обязана
 * оставаться непрозрачной, иначе под ней при скролле видны числа. */
tbody tr:hover th, tbody tr:hover td { background-image: linear-gradient(rgba(127, 127, 127, .08), rgba(127, 127, 127, .08)); }
/* Оформление страницы отчёта — то, что стоит сверх общей таблицы (`src/table.css`):
 * холст и типографика, панель выбора, состояния пустоты и адаптации под
 * узкое окно. Чисел и цвета дельт здесь нет намеренно: их задаёт общая часть, и она
 * же попадает в статический артефакт, поэтому двух наборов одной таблицы не
 * бывает. Страница открывается с диска, без сервера и без сети, поэтому ни одной
 * внешней ссылки в ней быть не может: только системные семейства шрифтов
 * (`ui-sans-serif`) и системные цвета (`Canvas`, `CanvasText`, `AccentColor`),
 * которые есть в любой теме.
 *
 * Общая часть заморожена байтами артефакта (`src/css.js`), поэтому всё, где
 * страница расходится с её геометрией, собрано в разделе «адаптации» с причиной:
 * растить общую часть нельзя, а на узком экране колонка коммита в 300px съедает
 * весь экран. */

:root {
  color-scheme: light dark;
  --gap: 12px;
  --pad: clamp(16px, 3vw, 34px);
  --radius: 10px;
  --muted: rgba(127, 127, 127, .85);
  --line: rgba(127, 127, 127, .32);
  --tint: rgba(127, 127, 127, .07);
}

/* Типографика и ритм: один шаг между блоками (--gap), крупный заголовок,
 * приглушённая подпись — чтобы взгляд доходил до чисел, а не до служебного текста. */
body {
  margin: 0;
  padding: var(--pad) var(--pad) 48px;
  background: Canvas;
  color: CanvasText;
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
h1 { margin: 0 0 3px; font-size: 21px; font-weight: 650; letter-spacing: -.012em; }
.sub { margin: 0 0 calc(var(--gap) + 4px); color: var(--muted); font-size: 12.5px; }

/* Панель выбора — карточка: она отделяет управление от данных и не сливается с
 * таблицей, которая начинается ниже. */
.panel {
  margin: 0 0 var(--gap);
  padding: 12px 14px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--tint);
}
.panel fieldset { margin: 0; padding: 0; border: 0; }
.panel fieldset + fieldset { margin-top: 10px; }
.panel legend, .panel .cap {
  padding: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.panel .cap { display: block; margin-bottom: 4px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
/* Способ замера — видимым текстом под переключателями: словарь токенов и способ
 * сжатия выбираются настройками запуска, а не галочкой, поэтому читателю мало
 * навести мышь — он должен видеть, чем получено число. */
.panel .about { margin: 5px 0 0; color: var(--muted); font-size: 11.5px; }

/* Дерево файлов: вложенность показана отступом и линией уровня, папка — такой же
 * переключатель, как файл, только его галочка отвечает за всё поддерево, а число
 * рядом говорит, за сколько файлов. Список файлов длиннее окна, поэтому панель
 * прокручивается сама: иначе управление вытолкнуло бы таблицу за экран.
 *
 * На узком экране прокручивается сам список (панель там растёт вместе со
 * страницей), на широком — панель целиком (ниже): прокрутка одна, и она у того,
 * кто и вправду ограничен окном. Шрифт файлов — тот же, что у чисел таблицы:
 * подписей в списке много и они короткие, а рядом с ними стоит таблица. */
.panel .files { max-height: min(30vh, 320px); overflow: auto; font-size: 12.5px; }
.panel .tree { margin: 0; padding: 0; list-style: none; }
.panel .tree .tree { margin-left: 14px; padding-left: 9px; border-left: 1px solid var(--line); }
.panel .tree .box { padding: 1px 7px 1px 5px; }
.box.dir { font-weight: 600; }
.box .n { margin-left: 1px; color: var(--muted); font-size: 11px; }

/* Переключатель — метка вокруг поля ввода: и подпись, и цель нажатия одна, поэтому
 * по нему попадает и мышь, и клавиатура (Space на поле ввода), и вспомогательные
 * технологии. */
.box {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 3px 9px 3px 7px;
  border-radius: 999px;
  cursor: pointer;
}
.box:hover { background: var(--tint); }
.box input { margin: 0; accent-color: AccentColor; }
.box.all { font-weight: 600; }

/* Расшифровки под деревом файлов нет намеренно: под списком она отодвигала
 * числа, а её содержимое и так стоит рядом с тем, что объясняет, — цвет дельт
 * называет сам знак числа, точность стоит под переключателями метрик, а знак
 * «файла ещё нет» — в подсказке клетки.
 *
 * Приближённое число помечено пунктиром, а не цветом: цвет в таблице занят дельтой
 * (рост и спад), и второй смысл на том же признаке читался бы как первый. */
#grid td.approx { text-decoration: underline dotted; text-underline-offset: 2.5px; }

/* Таблица — в своей рамке и со своим скроллом: шапка и колонка коммита липнут к ней
 * (правила липкости — в общей части), а не к странице, поэтому при прокрутке вбок
 * видно, чей это ряд, а при прокрутке вниз — что за колонка. */
.shell {
  overflow: auto;
  max-height: calc(100vh - 300px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: Canvas;
}
/* Числа плотнее текста страницы: их больше и они короче, а читаются по разрядам. */
#grid { font-size: 12.5px; }

/* Сообщение о присланной ссылке — над таблицей, чтобы пропустить его было нельзя,
 * но таблицу оно не отодвигает: одна строка на месте страницы. Цвет берётся
 * системный (акцент), своих цветов у страницы нет. */
.notice {
  margin: 0 0 var(--gap);
  padding: 9px 13px;
  border-left: 3px solid AccentColor;
  border-radius: 4px;
  background: var(--tint);
  font-size: 12.5px;
}
.notice[hidden] { display: none; }

/* Состояния пустоты: когда таблицу не из чего собрать, страница говорит об этом
 * словами, а не пустой сеткой. */
.state {
  margin: var(--gap) 0 0;
  padding: 11px 13px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 12.5px;
}
.state[hidden], .shell[hidden] { display: none; }

.note { margin: 14px 0 0; max-width: 90em; color: var(--muted); font-size: 12px; }
.note code { background: var(--tint); padding: 0 3px; border-radius: 3px; }

/* Клавиатура: рамка фокуса видна на любом фоне (системный цвет акцента) и не
 * сдвигает разметку. Ссылки журнала и все переключатели доступны с Tab. */
:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; border-radius: 3px; }

/* Широкая страница: панель выбора (метрики, дерево файлов) стоит **слева** от
 * таблицы, а страница целиком укладывается в окно. Это не украшение: на десктопе
 * бокового места много, а вертикального мало — переключатели и числа видны
 * одновременно, и ни прокрутка чисел, ни прокрутка списка файлов не уводит
 * управление за экран. Узкое окно эту же раскладку снимает (ниже): там столбцы
 * снова идут друг под другом, потому что рядом им не хватает ширины.
 *
 * Раскладка — сетка на `body`, а не обёртка в разметке: страница собирается
 * вклейкой глав (`src/page/build.js`), и добавлять ей узлы ради оформления значило
 * бы менять форму страницы в двух местах вместо одного. Строк пять, и они названы
 * по предмету: заголовок, сообщение о ссылке, **рабочая строка**, сообщение
 * пустоты и подпись. Тянется только рабочая — таблица получает всю оставшуюся
 * высоту, а панель не больше неё; при этом своя высота у панели не «сколько
 * получилось» (тогда она вытолкнула бы таблицу за экран), а та же рабочая строка,
 * внутри которой она прокручивается: список файлов длиннее окна — обычное дело.
 *
 * Порог 900px — тот же, что у адаптаций ниже: одна граница на «широко» и «узко»,
 * иначе между двумя порогами страница осталась бы без ни одного правила. */
@media (min-width: 900px) {
  body {
    box-sizing: border-box;
    height: 100vh;
    height: 100dvh;
    padding-bottom: var(--gap);
    overflow: auto;
    display: grid;
    grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    column-gap: var(--gap);
    align-items: stretch;
  }
  header { grid-area: 1 / 1 / 2 / -1; }
  #notice { grid-area: 2 / 2 / 3 / 3; }
  #shell { grid-area: 3 / 2 / 4 / 3; }
  #state { grid-area: 4 / 2 / 5 / 3; align-self: start; }
  #note { grid-area: 5 / 2 / 6 / 3; }
  /* Работа — на всю высоту, как и таблица: панель кончается там же, где она.
   * Прокручивается панель, а не страница. Верхнего отступа у неё здесь нет:
   * список проезжает под ним, и липкая строка категорий стояла бы не вплотную к
   * краю, а под полосой проезжающих файлов. Отступ никуда не делся — он у первого
   * поля, и уезжает вместе с ним. */
  #panel { grid-area: 2 / 1 / -1 / 2; min-height: 0; margin-bottom: 0; padding-top: 0; overflow: auto; }
  .panel > fieldset:first-child { padding-top: 12px; }
  /* Высоту таблицы здесь задаёт строка, а не окно: своё правило высоты ей нужно
   * только в узком окне, где страница прокручивается целиком. */
  .shell { max-height: none; }
  /* Прокрутка у панели одна: список файлов больше её не заводит, и поле «Файлы»
   * не режет дерево своим потолком. */
  .panel .files { max-height: none; overflow: visible; }
  /* Переключатели категорий остаются на виду, пока листаешь дерево. Фон — тот же,
   * что у панели (поверхность плюс её подсветка), иначе под ними читались бы
   * проезжающие строки списка. */
  .panel .cats {
    position: sticky;
    top: 0;
    z-index: 2;
    background-color: Canvas;
    background-image: linear-gradient(var(--tint), var(--tint));
  }
  /* Без метрик таблицы нет, и растянутая пустая строка ей не место: свободное
   * место этой строки забирает сообщение о пустоте, а не полоса над ним. */
  body:has(#shell[hidden]) #state { grid-area: 3 / 2 / 4 / 3; }
}

/* Адаптации: единственное место, где страница правит общую геометрию, — потому что
 * общая часть заморожена байтами артефакта, а не потому что так удобнее. Порог —
 * 899px, а не 900: при ровно 900px обе половины применились бы к одной странице, и
 * от «узкой» в «широкой» остался бы потолок высоты таблицы — то есть пустое место
 * под ней на одном единственном размере окна. */
@media (max-width: 899px) {
  body { padding: 14px 14px 32px; }
  h1 { font-size: 18px; }
  #grid { font-size: 12px; }
  .shell { max-height: calc(100vh - 260px); }
  .clip { width: 190px; }
}
</style>
</head>

<script>
/* Производные величины отчёта: из абсолютных значений получаются итоги, дельты,
 * содержимое клетки и подпись коммита.
 *
 * Единственное место, где это считается. Оба вывода пользуются этим файлом:
 * статический артефакт импортирует его как обычный модуль, а страница получает
 * его текст вклеенным в свой единственный файл (внешних ссылок страница иметь не
 * может). Поэтому у этого файла два требования, и оба обязательны:
 *
 *   1. Ни импортов, ни состояния модуля — иначе текст нельзя вклеить;
 *   2. Один `import` на строку и экспорт объявлением (`export function`), а не
 *      списком имён: модульный синтаксис при вклейке снимается построчно, и
 *      непонятая строка не должна молча попасть в страницу (`pageScript`).
 *
 * Расхождение двух отчётов возможно только здесь, поэтому и стеречь его надо
 * здесь: `test/contract-derived.test.js` сверяет числа страницы с числами
 * артефакта, а `test/page-view.test.js` следит, чтобы у страницы не появилось
 * своего расчёта. */

// Разряды тонкими пробелами: toLocaleString зависит от ICU сборки Node, а строка
// таблицы обязана совпадать побайтово на любой машине.
function group(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
}

/* Итог: сумма по включённым файлам. Выключенный файл не участвует ни в таблице,
 * ни в сумме, — иначе «итого» отвечало бы не про то, что видно. */
function totalsOf(values, metrics, on) {
  const out = {};
  metrics.forEach((m) => { out[m] = 0; });
  values.forEach((v, i) => {
    if (v === null || (on !== undefined && !on[i])) return;
    metrics.forEach((m) => { out[m] += v[m]; });
  });
  return out;
}

/* Дельта к предыдущему коммиту. Появление файла — рост на весь его объём: иначе
 * сумма дельт по колонке не сходилась бы с текущим размером. */
function deltaOf(now, before) {
  return before === null || before === undefined ? now : now - before;
}

/* Содержимое клетки строки-коммита: что в ней написано и каким цветом. Разметку
 * из этого делает каждый вывод сам (строка HTML или узел DOM), а правила одни.
 * Пустая клетка — «не менялось», `—` — файла в ревизии нет.
 * `minus` — знак минуса: у артефакта он заморожен эталоном побайтово, страница
 * ставит типографский. */
function cellParts(value, delta, minus) {
  if (value === null) return { text: '—', dir: null, miss: true };
  if (!delta) return { text: '', dir: null, miss: false };
  return {
    text: (delta > 0 ? '+' : minus) + group(Math.abs(delta)),
    dir: delta > 0 ? 'up' : 'down',
    miss: false
  };
}

// Клетка верхней строки: абсолютный размер, без дельты.
function valueParts(value) {
  return value === null ? { text: '—', miss: true } : { text: group(value), miss: false };
}

/* Строка-коммит: блок «общий объём» и по блоку на включённый файл, в каждом —
 * клетка на метрику. Отбор включённых файлов происходит здесь, поэтому и таблица,
 * и суммы считаются от одного выбора. */
function rowModel(values, prev, metrics, on) {
  const total = totalsOf(values, metrics, on);
  const prevTotal = prev === null ? null : totalsOf(prev, metrics, on);
  const out = {
    total: metrics.map((m) => ({
      value: total[m],
      delta: deltaOf(total[m], prevTotal === null ? null : prevTotal[m])
    })),
    files: []
  };
  values.forEach((v, i) => {
    if (on !== undefined && !on[i]) return;
    const before = prev === null || prev[i] === null ? null : prev[i];
    out.files.push(metrics.map((m) => {
      const value = v === null ? null : v[m];
      const was = value === null || before === null ? null : before[m];
      return { value: value, delta: value === null ? null : deltaOf(value, was) };
    }));
  });
  return out;
}

/* Верхняя строка — абсолютные размеры на HEAD: абсолютное число стоит в таблице
 * один раз, и именно с ним сходятся все дельты под ним. */
function nowModel(values, metrics, on) {
  const total = totalsOf(values, metrics, on);
  const files = [];
  values.forEach((v, i) => {
    if (on !== undefined && !on[i]) return;
    files.push(metrics.map((m) => (v === null ? null : v[m])));
  });
  return { total: metrics.map((m) => total[m]), files: files };
}

/* Подпись коммита в терминах данных: что показать, чем подписать и куда вести.
 * Ссылку считает `rowHref` движка — то же место, откуда её берёт контракт для
 * страницы, поэтому оба вывода ведут туда же. Подпись всплывающей строки тоже
 * здесь: два вывода не должны подписывать один коммит по-разному. */
function commitParts(row, showSha, href) {
  const short = showSha ? row.sha.slice(0, 7) : '';
  return {
    when: row.when,
    subject: row.subject,
    short: short,
    title: short === '' ? row.subject : row.subject + ' · ' + short,
    href: href || null,
    mark: row.section === null
      ? { text: '—', title: null }
      : { text: '§' + row.section.id + (row.section.added ? '' : '*'), title: row.section.head }
  };
}

/* Программа страницы отчёта: панель выбора с легендой и таблица.
 *
 * Это обычный исходник, а не строка в движке: его видит линтер, и он же
 * вклеивается в собранную страницу (`pageScript` снимает модульный синтаксис —
 * импорт ниже и объявления с `export` из соседнего файла). Расчёт берётся из
 * производных величин, поэтому включение метрики, категории или файла зовёт тот
 * же расчёт, что считает статическую таблицу, и не может дать других чисел.
 *
 * Страница — один файл без внешних ссылок, поэтому здесь нет ни динамического
 * импорта, ни загрузки чего-либо по сети: оформление приходит тем же файлом,
 * а разметка клеток повторяет статическую таблицу (`clip` и подпись коммита —
 * правила общей части оформления).
 *
 * Панель помнит выбор читателя между открытиями и умеет передать его ссылкой
 * («Память выбора» ниже): запись привязана к паспорту отчёта и хранит только
 * выключенное по именам, поэтому чужая запись не применяется, а исчезнувшее имя
 * просто ничего не значит. Та же запись ложится в адрес — его и отправляют коллеге.
 *
 * Точность числа страница не выводит сама: пометки приближённых клеток приходят в
 * данных, от того же правила, по которому названа точность метрики. Из путей и
 * форматов страница такого вывода не делает — второго правила точности не будет. */

/* Импорт — одной строкой: модульный синтаксис снимается при вклейке построчно,
 * и оставшаяся строка `import` попала бы в страницу (её ловит проверка). */

const appData = JSON.parse(document.getElementById('data').textContent);
const appUi = JSON.parse(document.getElementById('ui').textContent);
const appView = { metrics: {}, files: [] };
appData.metrics.forEach((m) => { appView.metrics[m.key] = true; });
appData.files.forEach(() => { appView.files.push(true); });

/* Описание метрики по ключу: подсказка приближённой клетки называет способ её
 * числа — тот же, что стоит в подписи метрики, поэтому двух ответов про «чем
 * посчитано» у страницы нет. */
const appMetric = {};
appData.metrics.forEach((m) => { appMetric[m.key] = m; });

/* Ссылка — это тот же выбор в адресе, под своим именем: чужой якорь страницы
 * ссылкой не считается, и спорить с ним нечем. */
const APP_LINK = '#size-report=';

/* Три обстоятельства первой отрисовки, которые действуют только на ней:
 * адрес в ней не переписывается (его прислали читателю, а не наоборот), память
 * не трогается (присланная ссылка — не выбор читателя), а сообщение о ссылке
 * ещё не гаснет. */
let appStartup = true;
let appForeign = false;
let appTransient = false;

/* -------- память выбора читателя -------- */

/* Имя файла для записи — путь на HEAD, а если файла там уже нет, последний из
 * настроек: по нему файл и опознаётся в отчёте. */
function appFileAt(i) {
  const f = appData.files[i];
  return f.path === null ? f.paths[0] : f.path;
}

/* Отпечаток паспорта: опознавательный знак записи, а не защита от подделки,
 * поэтому 32 бит достаточно (FNV-1a). */
function appHash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}

/* Паспорт отчёта: имя инструмента, схема данных, путь артефакта, заголовок и метки
 * колонок в порядке отчёта. Он и отделяет один отчёт от другого — по нему выбирается
 * ключ записи, поэтому выбор с чужого отчёта не подхватывается. Версии пакета и
 * верхушки истории в паспорте нет намеренно: это тот же отчёт — обновление
 * инструмента не меняет того, что значит колонка, а подросшая история это та же
 * история, к которой читатель и возвращается. */
function appPassport() {
  return appHash([appData.tool.name, appData.schema, appData.report.artifact,
    appData.report.title, appData.files.map((f) => f.label).join('|')].join('\n'));
}
const appKey = 'size-report:' + appPassport();

/* Запись выбора — одна на всё: её кладут и в память, и в адрес, поэтому двух
 * форматов одного состояния не бывает. Хранится только выключенное, по именам:
 * «включено» и «записи нет» — одно и то же состояние, поэтому возврат всех галочек
 * убирает запись, а не оставляет след, неотличимый от выбора. */
function appRecord() {
  const metrics = {};
  const files = {};
  appData.metrics.forEach((m) => { if (!appView.metrics[m.key]) metrics[m.key] = false; });
  appData.files.forEach((_f, i) => { if (!appView.files[i]) files[appFileAt(i)] = false; });
  return { v: 1, passport: appPassport(), metrics: metrics, files: files };
}

// Своя ли запись и того ли формата — одно правило и для памяти, и для адреса.
function appRecordOk(rec) {
  return rec !== null && typeof rec === 'object' && rec.v === 1 && rec.passport === appPassport();
}

function appWrite() {
  const rec = appRecord();
  const empty = Object.keys(rec.metrics).length === 0 && Object.keys(rec.files).length === 0;
  if (!appTransient) {
    try {
      if (empty) window.localStorage.removeItem(appKey);
      else window.localStorage.setItem(appKey, JSON.stringify(rec));
    } catch (_e) {
      /* Памяти нет (браузер её не даёт этой странице): выбор не переживёт закрытия,
       * а числа и разметка от этого не зависят. */
    }
  }
  /* Адрес и есть ссылка для коллеги, поэтому он повторяет выбор. Но не на первой
   * отрисовке и не тогда, когда ссылка оказалась чужой: присланный адрес — не наш,
   * его читателю ещё читать. */
  if (appStartup || appForeign) return;
  try {
    window.history.replaceState(null, '', APP_LINK + encodeURIComponent(JSON.stringify(rec)));
  } catch (_e) {
    /* Браузер не даёт менять адрес: ссылку тогда берут из памяти браузера. */
  }
}

/* Сброс к «включено всё»: граница между «в отчёте этого больше нет» и
 * «выключено» — это запись, а не отсутствие значения. Ссылка несёт весь выбор
 * отправителя, поэтому применяется на чистом виде, а не поверх чужого. */
function appAll() {
  appData.metrics.forEach((m) => { appView.metrics[m.key] = true; });
  appData.files.forEach((_f, i) => { appView.files[i] = true; });
}

/* Что говорит адрес. Отвечает либо своей записью, либо отказом (`linkForeign` —
 * ссылка другого отчёта, `linkBroken` — прочитать нечего): чужой или испорченный
 * выбор не применяется, но и не молчит — иначе читатель не поймёт, почему он видит
 * не то, что ему прислали. Адрес без имени ссылки не ссылка вовсе: молчание, чтобы
 * не спорить с обычными якорями страницы. */
function appLinkRead() {
  const hash = window.location.hash || '';
  if (hash.indexOf(APP_LINK) !== 0) return { rec: null, refused: null };
  const body = hash.slice(APP_LINK.length);
  let rec = null;
  try {
    rec = JSON.parse(decodeURIComponent(body));
  } catch (_e) {
    try {
      rec = JSON.parse(body);
    } catch (_e2) {
      return { rec: null, refused: 'linkBroken' };
    }
  }
  if (!appRecordOk(rec)) {
    return { rec: null, refused: rec === null || typeof rec !== 'object' || rec.v !== 1
      ? 'linkBroken' : 'linkForeign' };
  }
  return { rec: rec, refused: null, extra: appUnknown(rec) };
}

/* Сколько имён в ссылке этому отчёту неизвестны: о них читателю надо сказать —
 * иначе он будет искать в таблице то, чего в ней и не было. */
function appUnknown(rec) {
  const known = {};
  const metricKeys = {};
  appData.files.forEach((_f, i) => { known[appFileAt(i)] = true; });
  appData.metrics.forEach((m) => { metricKeys[m.key] = true; });
  let n = 0;
  Object.keys(rec.metrics || {}).forEach((k) => { if (!metricKeys[k]) n++; });
  Object.keys(rec.files || {}).forEach((k) => { if (!known[k]) n++; });
  return n;
}

/* Сообщение о ссылке гаснет после первого же действия читателя: он его прочитал, а
 * постоянное предупреждение — это шум поверх чисел. */
function appNotice(text) {
  const el = document.getElementById('notice');
  el.textContent = text;
  el.hidden = text === '';
}

/* Что делает с адресом его событие — открытие страницы и перемена якоря на уже
 * открытой (браузер в этом случае документ не перезагружает, а лишь переставляет
 * якорь, поэтому без этого разбора ссылка работала бы только в новой вкладке).
 * Своя ссылка заменяет вид целиком: в ней весь выбор отправителя, а не разница с
 * чужим. Отказ объясняется словами — и не трогает ни вид, ни адрес. */
function appLinkUse() {
  const link = appLinkRead();
  if (link.rec !== null) {
    appAll();
    appApply(link.rec);
    if (link.extra > 0) appNotice(appUi.linkExtra.replace('{n}', link.extra));
    return 'ours';
  }
  if (link.refused !== null) {
    appNotice(appUi[link.refused]);
    return 'refused';
  }
  return 'none';
}

/* Чтение: только своя запись — своей версии формата и своего паспорта. Запись
 * чужого отчёта лежит под другим ключом, а чужая, устаревшая или испорченная
 * равносильна её отсутствию. */
function appRead() {
  let text = null;
  try {
    text = window.localStorage.getItem(appKey);
  } catch (_e) {
    return null;
  }
  if (text === null) return null;
  let rec = null;
  try {
    rec = JSON.parse(text);
  } catch (_e) {
    return null;
  }
  return appRecordOk(rec) ? rec : null;
}

/* Применение — по именам: файл опознаётся путём, метрика ключом. Имени, которого в
 * отчёте нет, ничего не соответствует (колонку перенаправили на другой путь,
 * метрику убрали из настроек), а появившиеся файлы и метрики остаются включёнными —
 * как их видит тот, кто открыл страницу впервые. */
function appApply(rec) {
  const metrics = rec.metrics || {};
  const files = rec.files || {};
  appData.metrics.forEach((m) => { if (metrics[m.key] === false) appView.metrics[m.key] = false; });
  appData.files.forEach((_f, i) => { if (files[appFileAt(i)] === false) appView.files[i] = false; });
}

function appEl(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

/* Переключатель — метка вокруг поля ввода: цель нажатия одна, поэтому по нему
 * попадают и мышь, и клавиатура (`Space` на поле ввода), и вспомогательные
 * технологии. Подпись видимая, подробности — во всплывающей строке. */
function appBox(label, title, checked, onChange, cls) {
  const box = appEl('label', 'box' + (cls ? ' ' + cls : ''));
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = checked;
  if (title) input.title = title;
  input.addEventListener('change', onChange);
  box.appendChild(input);
  box.appendChild(appEl('span', null, label));
  return box;
}

/* Галочку файла ставит только файл: и категория, и папка в дереве — способы
 * переставить те же галочки сразу группой, а своего состояния у них нет. Иначе
 * одно и то же решение жило бы в двух местах и расходилось. */
function appFileBox(i) {
  const f = appData.files[i];
  const where = appFileAt(i) + (f.path === null ? ' (нет на HEAD)' : '');
  return appBox(f.label, where + ' · категория: '
    + (f.categoryBy === 'config' ? 'из настроек' : 'по расширению'), appView.files[i], (e) => {
    appView.files[i] = e.target.checked;
    appRender();
  });
}

/* Все файлы поддерева — то, чем управляет переключатель папки. */
function appIndexes(node) {
  const out = node.files.slice();
  node.dirs.forEach((sub) => { out.push(...appIndexes(sub)); });
  return out;
}

/* Узлы одного уровня: сперва папки по алфавиту, затем файлы в порядке данных.
 * Переключатель папки стоит над своим поддеревом и показывает три состояния: все
 * файлы включены, часть, ни одного. */
function appTreeList(node) {
  const list = appEl('ul', 'tree');
  [...node.dirs.keys()].sort().forEach((name) => {
    const sub = node.dirs.get(name);
    const idx = appIndexes(sub);
    const on = idx.map((i) => appView.files[i]);
    const some = on.some((v) => v);
    const head = appBox(name + '/', appUi.dir.replace('{name}', name).replace('{n}', idx.length),
      some && on.every((v) => v), (e) => {
        idx.forEach((i) => { appView.files[i] = e.target.checked; });
        appRender();
      }, 'dir');
    head.querySelector('input').indeterminate = some && !on.every((v) => v);
    head.appendChild(appEl('span', 'n', idx.length));
    const li = appEl('li');
    li.appendChild(head);
    li.appendChild(appTreeList(sub));
    list.appendChild(li);
  });
  node.files.forEach((i) => {
    const li = appEl('li');
    li.appendChild(appFileBox(i));
    list.appendChild(li);
  });
  return list;
}

/* Дерево файлов: путь делится по «/», папки становятся узлами, файлы — листьями.
 * Строится из тех же путей, что показаны в подписи файла, поэтому дерево и список
 * файлов не могут разойтись. */
function appTree() {
  const root = { files: [], dirs: new Map() };
  appData.files.forEach((f, i) => {
    const parts = (f.path === null ? f.paths[0] : f.path).split('/');
    let node = root;
    for (let d = 0; d < parts.length - 1; d++) {
      if (!node.dirs.has(parts[d])) node.dirs.set(parts[d], { files: [], dirs: new Map() });
      node = node.dirs.get(parts[d]);
    }
    node.files.push(i);
  });
  return appTreeList(root);
}

function appPanel() {
  const panel = document.getElementById('panel');
  panel.textContent = '';

  const metrics = appEl('fieldset');
  metrics.appendChild(appEl('legend', null, appUi.metrics));
  const mrow = appEl('div', 'row');
  appData.metrics.forEach((m) => {
    const word = m.accuracy === 'exact' ? appUi.exact : appUi.approximate;
    mrow.appendChild(appBox(m.label, m.note + ' · ' + word, appView.metrics[m.key], (e) => {
      appView.metrics[m.key] = e.target.checked;
      appRender();
    }, 'metric'));
  });
  metrics.appendChild(mrow);
  /* Чем получено каждое число — видно, а не только во всплывающей строке: словарь
   * токенов и способ сжатия выбираются настройками запуска, переключить их
   * странице нечем, и читателю важно знать это, не наводя мышь. */
  appData.metrics.forEach((m) => {
    metrics.appendChild(appEl('p', 'about', m.label + ' — ' + appUi.methodLabel + ' ' + m.method));
  });
  panel.appendChild(metrics);

  const files = appEl('fieldset', 'files');
  files.appendChild(appEl('legend', null, appUi.files));
  /* Строка категорий помечена классом: список файлов листается, и она остаётся на
   * виду (липкость — в широкой раскладке, там панель и прокручивается). */
  const cats = appEl('div', 'row cats');
  appData.categories.forEach((cat) => {
    const idx = [];
    appData.files.forEach((f, i) => { if (f.category === cat.key) idx.push(i); });
    cats.appendChild(appBox(cat.label, appUi.all + ' · ' + cat.label, idx.every((i) => appView.files[i]),
      (e) => {
        idx.forEach((i) => { appView.files[i] = e.target.checked; });
        appRender();
      }, 'all'));
  });
  files.appendChild(cats);
  files.appendChild(appTree());
  panel.appendChild(files);
}

/* Приближённая клетка: пометка берётся из данных движка, а не выводится здесь из
 * пути файла, — правило точности живёт там же, где считаются числа. У клетки
 * файла это её собственное число, у итога — худшее из вошедших в него, иначе
 * сумма обещала бы точность, которой нет у слагаемых. Возвращается описание
 * метрики (её способ и идёт в подсказку клетки) либо ничего. */
function appApprox(where, files, key) {
  const marks = appData.approx[key];
  if (marks === undefined) return null;
  const row = where === 'now' ? marks.now : marks.rows;
  const base = where === 'now' ? 0 : where * appData.files.length;
  for (let i = 0; i < files.length; i++) {
    if (row.charAt(base + files[i]) === '1') return appMetric[key];
  }
  return null;
}

/* Класс клетки собирается в одном месте: и пометка приближения, и пропуск
 * («файла нет») — свойства самой клетки, а не её содержимого. */
function appCellClass(first, miss, approx) {
  return 'num' + (first ? ' g' : '') + (miss ? ' miss' : '') + (approx === null ? '' : ' approx');
}

// Разметка клетки строки-коммита: правила — в cellParts, здесь только узел.
function appCell(cell, first, approx) {
  const parts = cellParts(cell.value, cell.delta, '−');
  const td = appEl('td', appCellClass(first, parts.miss, approx));
  if (approx !== null) td.title = appUi.approxCell + approx.method;
  if (parts.dir === null) td.textContent = parts.text;
  else td.appendChild(appEl('span', 'delta ' + parts.dir, parts.text));
  return td;
}

// Разметка клетки верхней строки: правила — в valueParts.
function appValueCell(value, first, approx) {
  const parts = valueParts(value);
  const td = appEl('td', appCellClass(first, parts.miss, approx));
  if (approx !== null) td.title = appUi.approxCell + approx.method;
  td.textContent = parts.text;
  return td;
}

/* Подпись коммита — той же разметкой, что в статической таблице: дата, тема,
 * метка раздела журнала. Ширину колонки и обрезку длинной темы задаёт общая часть
 * оформления, поэтому колонка не прыгает при переключении файлов. */
function appCommit(row) {
  const parts = commitParts(row, appData.report.showSha, row.href);
  const name = parts.href ? appEl('a', 'subj', parts.subject) : appEl('span', 'subj', parts.subject);
  if (parts.href) name.href = parts.href;
  name.title = parts.title;
  const mark = appEl('span', 'sect', parts.mark.text);
  if (parts.mark.title) mark.title = parts.mark.title;

  const clip = appEl('div', 'clip');
  clip.appendChild(appEl('span', 'when', parts.when));
  clip.appendChild(name);
  clip.appendChild(mark);
  const th = appEl('th', 'c-commit');
  th.appendChild(clip);
  return th;
}

function appSubHead(metrics) {
  const tr = appEl('tr');
  metrics.forEach((m, mi) => tr.appendChild(appEl('th', mi === 0 ? 'g' : '', m.label)));
  return tr;
}

/* Состояния пустоты: когда чисел не будет вовсе, страница говорит об этом словами,
 * а не сеткой без колонок. Файлы можно выключить все — тогда остаётся общий объём,
 * и подсказка объясняет, почему колонок нет. */
function appState(metricsCount, filesCount) {
  const state = document.getElementById('state');
  const text = metricsCount === 0 ? appUi.empty : (filesCount === 0 ? appUi.noFiles : '');
  state.textContent = text;
  state.hidden = text === '';
  document.getElementById('shell').hidden = metricsCount === 0;
}

/* Шапка: строка групп (итог и файлы) и строка метрик под ней. Метрики повторяются
 * на каждый файл, поэтому подшапка собирается один раз, а дальше её узлы
 * переезжают в следующие — копий разметки не заводится. */
function appHead(shown, files, metrics) {
  const head = appEl('tr');
  const commit = appEl('th', 'c-commit', appUi.commit);
  commit.rowSpan = 2;
  head.appendChild(commit);
  const total = appEl('th', 'g', appUi.total);
  total.colSpan = metrics.length;
  head.appendChild(total);
  files.forEach((i) => {
    const th = appEl('th', 'g', appData.files[i].label);
    th.colSpan = metrics.length;
    head.appendChild(th);
  });
  const subs = appSubHead(shown);
  files.forEach(() => {
    const more = appSubHead(shown);
    while (more.firstChild) subs.appendChild(more.firstChild);
  });
  const thead = appEl('thead');
  thead.appendChild(head);
  thead.appendChild(subs);
  return thead;
}

/* Строка-коммит: подпись и числа. Дельты считает общий расчёт (`rowModel`) — тот
 * же, что считает статическую таблицу; здесь только узлы. Пометка приближения —
 * своя у каждой клетки: у итога по всем вошедшим файлам, у файла — по нему самому. */
function appRow(r, metrics, files) {
  const row = appData.rows[r];
  const prev = r === 0 ? null : appData.rows[r - 1];
  const model = rowModel(row.values, prev === null ? null : prev.values, metrics, appView.files);
  const tr = appEl('tr');
  tr.appendChild(appCommit(row));
  model.total.forEach((cell, mi) => {
    tr.appendChild(appCell(cell, mi === 0, appApprox(r, files, metrics[mi])));
  });
  model.files.forEach((cells, fi) => cells.forEach((cell, mi) => {
    tr.appendChild(appCell(cell, mi === 0, appApprox(r, [files[fi]], metrics[mi])));
  }));
  return tr;
}

/* Тело: строки коммитов снизу вверх (свежие первыми) плюс верхняя строка «сейчас»
 * с абсолютными размерами на HEAD. Дельты под ней сходятся с ней, поэтому она и
 * стоит первой. */
function appBody(metrics, files) {
  const body = appEl('tbody');
  for (let r = appData.rows.length - 1; r >= 0; r--) body.appendChild(appRow(r, metrics, files));

  const now = appEl('tr', 'now');
  now.appendChild(appEl('th', 'c-commit', appUi.now));
  const nowCells = nowModel(appData.now, metrics, appView.files);
  nowCells.total.forEach((v, mi) => now.appendChild(appValueCell(v, mi === 0,
    appApprox('now', files, metrics[mi]))));
  nowCells.files.forEach((cells, fi) => cells.forEach((v, mi) => {
    now.appendChild(appValueCell(v, mi === 0, appApprox('now', [files[fi]], metrics[mi])));
  }));
  body.insertBefore(now, body.firstChild);
  return body;
}

/* Сборка таблицы: что показывать (метрики и файлы, оставленные читателем) и куда
 * это положить. Разметку шапки и строк строит глава таблицы, числа — общий расчёт:
 * здесь остаётся только решение и вставка, своих чисел у сборки нет. */
function appTable() {
  const shown = appData.metrics.filter((m) => appView.metrics[m.key]);
  const metrics = shown.map((m) => m.key);
  const on = appView.files;
  const files = [];
  appData.files.forEach((f, i) => { if (on[i]) files.push(i); });

  const table = document.getElementById('grid');
  table.textContent = '';
  appState(metrics.length, files.length);
  if (metrics.length === 0) return;

  table.appendChild(appHead(shown, files, metrics));
  table.appendChild(appBody(metrics, files));
  document.getElementById('note').textContent = appUi.note
    .replace('{rows}', appData.rows.length)
    .replace('{command}', appData.report.fixCommand);
  appWrite();
}

/* Прокрутка панели — свойство панели, а не разметки, поэтому она переживает
 * пересборку: иначе каждый клик по галочке возвращал бы список к началу, и до
 * нижних файлов дерева было бы не добраться. Запоминается прокрутка панели и
 * списка файлов — у каждого она своя, а в узком окне прокручивается список.
 * Элементы берутся те, что есть в разметке страницы (`src/page/build.js`):
 * второго перечисления мест прокрутки в пакете нет. */
const appScrolled = ['#panel', '#panel .files'];
function appScrollTop() {
  return appScrolled.map((sel) => {
    const el = document.querySelector(sel);
    return el === null ? 0 : el.scrollTop;
  });
}

function appScrollBack(saved) {
  appScrolled.forEach((sel, i) => {
    const el = document.querySelector(sel);
    if (el !== null) el.scrollTop = saved[i];
  });
}

/* Панель перерисовывается целиком, поэтому поле, стоящее под клавиатурой, и
 * прокрутка после каждой пересборки возвращаются на своё место: иначе
 * переключение с Tab и Space требовало бы начинать обход панели заново, а
 * прокрутка — искать своё место заново. Место поля опознаётся порядковым номером —
 * порядок полей панели от данных не зависит. Фокус ставится без прокрутки (`preventScroll`):
 * он возвращает клавиатуру, а не двигает список. */
function appRender(keepNotice) {
  const at = Array.from(document.querySelectorAll('#panel input')).indexOf(document.activeElement);
  const saved = appScrollTop();
  appPanel();
  appScrollBack(saved);
  if (at >= 0) document.querySelectorAll('#panel input')[at].focus({ preventScroll: true });
  appTable();
  /* Сообщение о ссылке переживает отрисовку, которая сама же им и вызвана, и
   * гаснет от действия читателя: он его уже прочитал. */
  if (keepNotice !== true) appNotice('');
}

/* Восстановление — до первой отрисовки: у того, кто открыл страницу впервые,
 * разметка обязана быть умолчанием, а не чужим выбором. Ссылка старше памяти: это
 * явный выбор отправителя, и пока читатель ничего не менял, она его собственный
 * выбор не подменяет — в память её запись не идёт. Отказ ссылки — не пустая
 * таблица, а сообщение: читателю видно и что произошло, и что показано вместо. */
const appStart = appLinkUse();
if (appStart === 'ours') appTransient = true;
else if (appStart === 'refused') appForeign = true;
if (appStart !== 'ours') {
  const appSaved = appRead();
  if (appSaved !== null) appApply(appSaved);
}
appRender(true);
appStartup = false;
appForeign = false;
appTransient = false;

/* Якорь сменился на открытой странице: выбор из нового адреса применяется тем же
 * кодом, что и при открытии. Свой собственный адрес такого события не поднимает
 * (`replaceState` его не вызывает), поэтому петли здесь нет. Отказ не трогает ни
 * вид — читатель продолжает смотреть то, что смотрел, — ни адрес: его прислали
 * читателю, и до первого его действия это не наше. */
window.addEventListener('hashchange', () => {
  const state = appLinkUse();
  if (state === 'refused') appForeign = true;
  appTransient = state === 'ours';
  appRender(true);
  appForeign = false;
  appTransient = false;
});
</script>
</body>
</html>

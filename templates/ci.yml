# Проверка объёма для проекта, подключившего size-report.
# Положите файл в .github/workflows/size-report.yml — правок он не требует.
#
# Что проверяется и почему так:
#   * таблица объёма на диске сходится с историей git — это числа отчёта;
#   * тот же снимок чисел, снятый в среде, где настроек git нет вовсе,
#     совпадает побайтово: вывод инструмента не должен зависеть от того, что
#     настроено на машине (BLOCKERS.md §B1, §B2).
#
# Секретов шаблон не требует. Единственный, который может понадобиться, — доступ
# к самому пакету, если он подключён приватной git-зависимостью: тогда перед
# установкой добавьте шаг с read-only deploy key (пример закомментирован ниже —
# ключ лежит в секретах проекта, а не в этом файле).
#
# Менеджер пакетов: ниже pnpm. Для npm — `npm ci` и `npx size-report` вместо
# `pnpm install` и `pnpm exec size`; для yarn — `yarn --immutable` и
# `yarn size-report`. Сама проверка — всегда одна и та же команда `size`.
#
# Отчёт не в git? Такое тоже задумано требованиями (отчёт — выводимый артефакт):
# тогда вместо шага «Таблица объёма совпадает с историей» поставьте сборку —
# `pnpm exec size --write` — и этот шаг будет проверять, что отчёт собирается.

name: size-report

on: [push, pull_request]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      # История нужна целиком: таблица строится по коммитам, и на обрезанном
      # клоне инструмент отказывается работать (код 3), а не пишет короткую.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # - uses: webfactory/ssh-agent@v0.9.0
      #   with:
      #     ssh-private-key: ${{ secrets.SIZE_REPORT_DEPLOY_KEY }}

      - name: Установка
        run: pnpm install --frozen-lockfile

      # Проверка — та же команда `size` без ключей: она собирает таблицу заново
      # и сверяет с файлом на диске. Своего набора тестов потребителю не нужно.
      - name: Таблица объёма совпадает с историей
        run: pnpm exec size

      - name: Снимок чисел контракта
        run: pnpm exec size --data > /tmp/size-report-data.json

      - name: Снимок чисел без настроек git на машине
        run: pnpm exec size --data > /tmp/size-report-data-null.json
        env:
          GIT_CONFIG_GLOBAL: /dev/null

      - name: Числа не зависят от настроек машины
        run: diff -u /tmp/size-report-data.json /tmp/size-report-data-null.json
